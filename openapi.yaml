openapi: 3.0.0
info:
  title: Notification Service
  version: 2.0.0
paths:
  /api/v1/notifications:
    post:
      summary: Send a notification
      operationId: send_notification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotification'
      responses:
        '201': {description: Notification sent}
        '422': {description: Invalid}
components:
  schemas:
    Notification:
      type: object
      required: [id, user_id, channel, message, status]
      properties:
        id: {type: string}
        user_id: {type: string}
        channel: {type: string}
        message: {type: string}
        status: {type: string}
    SendNotification:
      type: object
      required: [user_id, channel, message]
      properties:
        user_id: {type: string}
        channel: {type: string}
        message: {type: string}
